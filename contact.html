<script>
  const equalizer = document.querySelector(".equalizer");
  const bars = 100; // number of bars around photo

  // Create bars
  for (let i = 0; i < bars; i++) {
    const span = document.createElement("span");
    const angle = (360 / bars) * i;

    // Random animation duration & delay
    const duration = (1 + Math.random() * 1.2).toFixed(2); // 1.5s – 3s
    const delay = (Math.random() * 1).toFixed(2);             // 0s – 1s

    span.style.transform = `rotate(${angle}deg) scaleY(-1)`;
    span.style.animation = `beat ${duration}s infinite ease-in-out`;
    span.style.animationDelay = `${delay}s`;

    equalizer.appendChild(span);
  }

  // Randomize peak heights every 500ms
  setInterval(() => {
    document.querySelectorAll(".equalizer span").forEach(span => {
      const maxHeight = 15 + Math.random() * 40; // 15–55px
      span.style.setProperty("--max-height", `${maxHeight}px`);
    });
  }, 500);
</script>

<script>
  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const text = btn.parentElement.querySelector("pre").innerText;

      navigator.clipboard.writeText(text).then(() => {
        // Change to "copied" icon + green background
        btn.innerHTML = '<i class="bi bi-clipboard2-check"></i>';
        btn.classList.add("copied");

        setTimeout(() => {
          // Revert back to copy icon + default color
          btn.innerHTML = '<i class="bi bi-clipboard2"></i>';
          btn.classList.remove("copied");
        }, 2000);
      });
    });
  });
</script>

  <!-- Toggle Button -->
  <div id="chat-button" aria-label="Open chat" role="button">
    <span class="text">Talk to my bot</span>
    <span><i class="bi bi-chat-fill"></i></span>
  </div>

  <!-- Popup -->
  <section id="chat-popup" aria-label="Chat window" aria-hidden="true">
    <header id="chat-header">
      Chat with my QA bot
      <button id="close-btn" aria-label="Close chat">×</button>
    </header>
    <div id="webchat-container">
      <div id="webchat" role="main"></div>
    </div>
  </section>

  <script>
    const cfg = typeof getConfig === 'function' ? getConfig() : {};
    const chatInstance = cfg.Instance;
    const directLine = window.WebChat.createDirectLine({ secret: chatInstance });

    // Style options (avatars, bubbles, etc.)
    const styleOptions = {
      primaryFont: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
      backgroundColor: "rgba(33, 44, 54, 1)",
      sendBoxBackground: '#212C36', 
      sendBoxTextColor: '#fff',
      bubbleBackground: '#868afc',
      bubbleFromUserBackground: '#DCF8C6',
      bubbleFromUserBorderRadius: '10px',
      bubbleBorderRadius: '10px',
      botAvatarImage: 'src/boticon.jpg',
      botAvatarInitials: '',
      userAvatarImage: 'https://cdn-icons-png.flaticon.com/512/847/847969.png',
      userAvatarBackgroundColor: '#fff',
      userAvatarInitials: '',
      sendBoxButtonColor: '#868afc',
      sendBoxButtonColorOnHover: '#4e46e5',     
      hideUploadButton: true
    };

    window.WebChat.renderWebChat(
      {
        directLine,
        userID: 'user_' + Math.random().toString(36).slice(2, 11),
        username: 'You',
        locale: 'en-US',
        styleOptions
      },
      document.getElementById('webchat')
    );

    const chatButton = document.getElementById('chat-button');
    const chatPopup  = document.getElementById('chat-popup');
    const closeBtn   = document.getElementById('close-btn');

    function openChat() {
      chatPopup.classList.add('open');
      chatPopup.setAttribute('aria-hidden', 'false');

      setTimeout(() => window.dispatchEvent(new Event('resize')), 0);
      setTimeout(() => window.dispatchEvent(new Event('resize')), 150);

      setTimeout(() => {
        const input = document.querySelector('#webchat input[type="text"], #webchat textarea');
        if (input) input.focus();
      }, 200);
    }

    function closeChat() {
      chatPopup.classList.remove('open');
      chatPopup.setAttribute('aria-hidden', 'true');
    }

    chatButton.addEventListener('click', openChat);
    closeBtn.addEventListener('click', closeChat);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeChat();
    });
  </script>
